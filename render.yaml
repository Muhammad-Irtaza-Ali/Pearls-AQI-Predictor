services:
  - type: web
    name: pearls-aqi-predictor-api
    env: python
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SUPABASE_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ML_READY_TABLE
        value: ml_ready_records
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn feature_pipeline.api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true

  - type: web
    name: pearls-aqi-predictor-gui
    env: python
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: API_BASE_URL
        value: https://pearls-aqi-predictor.onrender.com
    buildCommand: python -m pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port $PORT
    autoDeploy: true
