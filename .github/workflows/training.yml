name: Daily model training

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ENABLED: ${{ secrets.SUPABASE_ENABLED }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_RAW_TABLE: ${{ secrets.SUPABASE_RAW_TABLE }}
      HOPSWORKS_ENABLED: ${{ secrets.HOPSWORKS_ENABLED }}
      HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
      HOPSWORKS_PYTHON_EXE: ${{ secrets.HOPSWORKS_PYTHON_EXE }}
      HOPSWORKS_ML_FEATURE_GROUP: ${{ secrets.HOPSWORKS_ML_FEATURE_GROUP }}
      HOPSWORKS_ML_FEATURE_GROUP_VERSION: ${{ secrets.HOPSWORKS_ML_FEATURE_GROUP_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Train models
        run: python scripts/train_models.py --source auto

      - name: Build evaluation summary
        run: python scripts/generate_model_evaluation.py

      - name: Inspect registry
        run: python scripts/model_registry.py

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/
            reports/model_training_report.json
            reports/model_evaluation_summary.json
          retention-days: 14
